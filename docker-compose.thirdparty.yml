# ============================================================
# AgentForge 第三方一键部署（包含所有基础设施）
# 使用: docker compose -f docker-compose.thirdparty.yml up -d
#
# 前置条件:
#   1. 复制 .env.example 为 .env 并填入 LLM_API_KEY 和 EMBEDDING_API_KEY
#   2. 确保端口 3306/6379/8000/8080/5173 未被占用（或在 .env 中修改）
# ============================================================

services:

  # ==================== 基础设施 ====================

  mysql:
    image: mysql:8.0
    container_name: af-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-synthesis}
      MYSQL_USER: ${MYSQL_USER:-agentforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agentforge123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: af-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: af-chroma
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      CHROMA_SERVER_CORS_ALLOW_ORIGINS: '["*"]'
      ANONYMIZED_TELEMETRY: "FALSE"
      TZ: Asia/Shanghai
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== 应用 ====================

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: agentforge-backend:latest
    container_name: af-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-synthesis}
      MYSQL_USER: ${MYSQL_USER:-agentforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agentforge123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      LLM_API_KEY: ${LLM_API_KEY:?请设置 LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-deepseek-v4-flash}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?请设置 EMBEDDING_API_KEY}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-3}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: agentforge-frontend:latest
    container_name: af-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

  # ==================== 监控（可选） ====================

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: af-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.0
    container_name: af-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./docker/grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  mysql-data:
  redis-data:
  chroma-data:
  prometheus-data:
  grafana-data:
