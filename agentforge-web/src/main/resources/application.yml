server:
  port: 8080


spring:
  application:
    name: agentforge
  profiles:
    active: dev
  config:
    import: nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  cloud:
    nacos:
      discovery:
        server-addr:
        namespace: public
      config:
        server-addr:
        file-extension: yml
        namespace: public