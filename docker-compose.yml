# ============================================================
# AgentForge Docker 部署
# 使用已有基础设施（Nacos/MySQL/Redis/ChromaDB），容器化前后端
# 使用: docker compose up -d
# ============================================================

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: agentforge-backend:latest
    container_name: agentforge-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    networks:
      - agentforge-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: agentforge-frontend:latest
    container_name: agentforge-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agentforge-net

networks:
  agentforge-net:
    driver: bridge
